apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskboard26-api
  labels:
    app: taskboard26-api
    app.kubernetes.io/name: taskboard26-api
    app.kubernetes.io/part-of: taskboard26
    app.kubernetes.io/managed-by: gitops-app
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: kube-system
  hostnames:
  - taskboard26-api.taskboard26-dev.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: taskboard26-api
      port: 80
